name: Watch 9router upstream

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: watch-9router-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect upstream revision
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(grep -E '^Upstream revision: \`[0-9a-f]{40}\`$' docs/upstream/9router-change-report.md | grep -Eo '[0-9a-f]{40}')"
          current="$(gh api repos/decolua/9router/commits/master --jq .sha)"
          test "${#previous}" = 40
          test "${#current}" = 40
          printf 'previous=%s\ncurrent=%s\n' "$previous" "$current" >> "$GITHUB_OUTPUT"
          if test "$previous" = "$current"; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Render change report
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.upstream.outputs.previous }}
          CURRENT: ${{ steps.upstream.outputs.current }}
        run: |
          set -euo pipefail
          gh api "repos/decolua/9router/compare/${PREVIOUS}...${CURRENT}" > compare.json
          jq -r --arg previous "$PREVIOUS" --arg current "$CURRENT" '
            ([.files[]?.additions] | add // 0) as $additions |
            ([.files[]?.deletions] | add // 0) as $deletions |
            [.files[]? | "- `\(.filename)` (\(.status)): +\(.additions) / -\(.deletions)"] as $files |
            [.commits[]? | "- [`\(.sha[0:12])`](https://github.com/decolua/9router/commit/\(.sha)): \(.commit.message | split("\n")[0])"] as $commits |
            "# 9router upstream change report",
            "",
            "Upstream repository: `decolua/9router`",
            "Upstream branch: `master`",
            "Upstream revision: `\($current)`",
            "Previous revision: `\($previous)`",
            "Compare URL: https://github.com/decolua/9router/compare/\($previous)...\($current)",
            "",
            "## Summary",
            "",
            "Commits: \(.total_commits // (.commits | length))",
            "Changed files: \(.files | length)",
            "Additions: \($additions)",
            "Deletions: \($deletions)",
            "",
            "## Changed files",
            "",
            ($files[]? // "- None"),
            "",
            "## Commits",
            "",
            ($commits[]? // "- None"),
            "",
            "> Report-only update. No route map, runtime, or release changes."
          ' compare.json > docs/upstream/9router-change-report.md
      - uses: peter-evans/create-pull-request@v7
        if: steps.upstream.outputs.changed == 'true'
        with:
          branch: bot/watch-9router-upstream
          title: "docs: report 9router upstream changes"
          commit-message: "docs: report 9router upstream changes"
          body: |
            Automated report-only update for decolua/9router.

            Previous: ${{ steps.upstream.outputs.previous }}
            Current: ${{ steps.upstream.outputs.current }}

            No route map, runtime, or release changes. No direct main changes.
          add-paths: docs/upstream/9router-change-report.md
